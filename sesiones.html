const COL={"FONDO":["#1d4ed8","#3b82f6"],"CUESTAS":["#b45309","#f59e0b"],"CARRERA":["#be123c","#f43f5e"],
"TEST":["#7e22ce","#a855f7"],"Recuper":["#166534","#22c55e"],"Trote":["#166534","#22c55e"],
"Rodaje":["#0f766e","#14b8a6"],"DEF":["#4338ca","#6366f1"]};
function col(s){for(const k in COL)if(s.toUpperCase().includes(k.toUpperCase())&&k!=="DEF")return COL[k];return COL.DEF}
const days=D.dias, sel=document.getElementById('sel');
days.forEach((x,i)=>{const o=document.createElement('option');o.value=i;
 o.textContent=x.fecha.slice(5)+" · "+x.dia.slice(0,3)+" · "+x.sesion.replace(/ — .*/,'');sel.appendChild(o)});
let done=JSON.parse(localStorage.getItem('rf_done')||'{}');
function li(a){return a.map(s=>s.startsWith('⚑')?`<span class="warn">${s.slice(1).trim()}</span>`:`<li>${s}</li>`).join('')}
function render(i){
 const x=days[i], c=col(x.sesion); sel.value=i;
 document.getElementById('prev').disabled=i===0;
 document.getElementById('next').disabled=i===days.length-1;
 const f=new Date(x.fecha+"T12:00:00").toLocaleDateString('es-MX',{day:'numeric',month:'long'});
 document.getElementById('card').innerHTML=`
 <div class="card" style="--c1:${c[0]};--c2:${c[1]}">
  <div class="hd"><div class="wk">${x.semana}</div><h2>${x.sesion}</h2><div class="dt">${x.dia} ${f} · ${x.fase}</div></div>
  <div class="pills"><div class="pill"><b>Volumen</b>${x.volumen}</div>
   <div class="pill"><b>Ritmo</b>${x.ritmo}</div><div class="pill"><b>Zona FC</b>${x.zona}</div>
   ${x.descanso?`<div class="pill"><b>Descanso entre reps</b>${x.descanso}</div>`:''}</div>
  <div class="blk"><h3>1 · Calentamiento <span class="tag">${x.cal_cod}</span></h3><ol>${li(x.cal)}</ol></div>
  <div class="blk"><h3>2 · Sesión principal</h3><div class="main"><div class="nm">${x.sesion}</div>
   <div class="row"><span>Volumen</span><span>${x.volumen}</span></div>
   <div class="row"><span>Ritmo</span><span>${x.ritmo}</span></div>
   <div class="row"><span>Zona FC</span><span>${x.zona}</span></div>
   ${x.descanso?`<div class="row"><span>Descanso entre reps</span><span>${x.descanso}</span></div>`:''}</div></div>
  <div class="blk"><h3>3 · Vuelta a la calma <span class="tag">${x.vc_cod}</span></h3><ol>${li(x.vc)}</ol></div>
  ${x.pm_titulo?`<div class="blk"><h3>4 · Tarde (PM)</h3><div class="main"><div class="nm">${x.pm_titulo}</div><ul style="margin-top:8px">${li(x.pm)}</ul></div></div>`:''}
  ${x.nota?`<div class="nota"><b>Coach:</b> ${x.nota}</div>`:''}
  <div class="rut">${x.rutina}</div>
  <div class="done"><label><input type="checkbox" id="ck" ${done[x.fecha]?'checked':''}> Sesión completada</label></div>
 </div>`;
 document.getElementById('ck').onchange=e=>{done[x.fecha]=e.target.checked;
  localStorage.setItem('rf_done',JSON.stringify(done));stats()};
 stats();
}
function stats(){const n=Object.values(done).filter(Boolean).length;
 document.getElementById('cnt').textContent=n+" / "+days.length+" sesiones";
 document.getElementById('prog').style.width=(n/days.length*100)+"%"}
function hoyIdx(){const t=new Date().toISOString().slice(0,10);
 let i=days.findIndex(x=>x.fecha===t); if(i<0)i=days.findIndex(x=>x.fecha>t); return i<0?days.length-1:i}
let cur=hoyIdx();
document.getElementById('prev').onclick=()=>render(--cur);
document.getElementById('next').onclick=()=>render(++cur);
document.getElementById('hoy').onclick=()=>{cur=hoyIdx();render(cur)};
sel.onchange=e=>{cur=+e.target.value;render(cur)};
document.getElementById('reglas').innerHTML=D.reglas.map(r=>`<li>${r}</li>`).join('');
render(cur);
</script></body></html>
